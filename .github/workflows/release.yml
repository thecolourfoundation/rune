name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  asset: rune-linux-x64,         platform: linux,  suffix: linux-x64 }
          - { os: macos-latest,   asset: rune-macos-arm64,       platform: darwin, suffix: darwin-arm64 }
          - { os: windows-latest, asset: rune-windows-x64.exe,   platform: win32,  suffix: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Tests
        if: runner.os == 'Linux'
        run: npm test
      - name: Build binary
        shell: bash
        run: scripts/build-binary.sh "dist/${{ matrix.asset }}"
      - name: Check binary version matches package.json
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          "dist/${{ matrix.asset }}" --version | grep -q "$V"
      - name: Pack MCPB bundle
        shell: bash
        run: node scripts/pack-mcpb.mjs "${{ matrix.platform }}" "dist/${{ matrix.asset }}" "dist/rune-mcp-${{ matrix.suffix }}.mcpb"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/rune-mcp-${{ matrix.suffix }}.mcpb

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum rune-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" rune-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" rune-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  registry:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/registry.yml
    with:
      tag: ${{ github.ref_name }}
